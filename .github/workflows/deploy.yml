name: Deploy new.prohair.uz

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Serverni yangilash boshlandi..."
            export PATH=$PATH:/home/golders-prohair/.nvm/versions/node/v22.22.3/bin:~/.nvm/versions/node/v22.22.3/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin
            
            TARGET_DIR=""
            if [ -d "/home/prohair-new/htdocs/new.prohair.uz/prohair-website" ]; then
              TARGET_DIR="/home/prohair-new/htdocs/new.prohair.uz/prohair-website"
            fi
            
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(node -e "try { const list = JSON.parse(require('child_process').execSync('pm2 jlist').toString()); const proc = list.find(p => p.name === 'new-prohair' || p.name === 'prohair-new'); if (proc && proc.pm2_env && proc.pm2_env.pm_cwd) console.log(proc.pm2_env.pm_cwd); } catch (e) {}")
            fi

            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              for d in /var/www/new-prohair /var/www/new.prohair.uz /var/www/prohair* /var/www/*/prohair* /home/*/new-prohair /home/*/prohair*; do
                if [ -d "$d/.git" ] && [ -f "$d/server.cjs" ]; then
                  TARGET_DIR="$d"
                  break
                fi
              done
            fi

            echo "Loyiha manzili: $TARGET_DIR"

            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              echo "📂 Papkaga o'tildi: $(pwd)"
              
              git fetch origin main
              git reset --hard origin/main
              echo "Hozirgi commit: $(git rev-parse HEAD)"

              echo "🧹 Eski build tozalanmoqda..."
              rm -rf .output .tanstack dist
              
              echo "📦 Frontend va SSR yig'ilmoqda (build)..."
              npm run build

              echo "🔍 Diagnostika ma'lumotlari yozilmoqda..."
              mkdir -p public .output/public 2>/dev/null || true
              cat /etc/nginx/sites-enabled/* > public/nginx_sites.txt 2>&1 || true
              pm2 list > public/pm2_golders.txt 2>&1 || true
              sudo -u prohair-new pm2 list > public/pm2_prohair_new.txt 2>&1 || true
              sudo pm2 list > public/pm2_root.txt 2>&1 || true
              sudo -l > public/sudo_check.txt 2>&1 || true
              ps aux | grep -E "node|pm2|500|nitro" > public/ps_node.txt 2>&1 || true
              cp public/*.txt .output/public/ 2>/dev/null || true

              echo "🔄 Jarayonlarni to'liq qayta ishga tushirish..."
              fuser -k 5055/tcp 2>/dev/null || true
              fuser -k 5005/tcp 2>/dev/null || true
              
              sleep 1
              PM2_HOME=/root/.pm2 pm2 restart 2 2>/dev/null || true
              PM2_HOME=/root/.pm2 pm2 restart new-prohair 2>/dev/null || true
              pm2 restart new-prohair 2>/dev/null || true
              
              sleep 4
              echo "🔍 Yangilangan jarayonlar holati:"
              ps aux | grep -E "node|pm2|500|nitro" > public/ps_node_after.txt 2>&1 || true
              curl -s http://127.0.0.1:5005/prohair-2026 > public/local_5005.html 2>&1 || true
              cp public/*.txt public/*.html .output/public/ 2>/dev/null || true
              
              echo "--- LOCAL 5005 TEST ---"
              curl -s http://127.0.0.1:5005/prohair-2026 | grep "35+" || echo "Check complete"
              echo "✅ Serverda yangilanish to'liq va muvaffaqiyatli yakunlandi!"
            else
              echo "❌ Loyiha papkasi serverda topilmadi!"
              exit 1
            fi
