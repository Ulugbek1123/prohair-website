name: Deploy new.prohair.uz

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Deploy boshlandi..."
            cd /home/golders-prohair/new-prohair || cd ~/new-prohair
            
            # Yangi kodni olish
            git pull origin main
            
            # Yangi bog'liqliklarni o'rnatish
            npm install --production=false
            
            # Frontend va SSR ni yig'ish (build)
            npm run build
            
            # 5005-portda PM2 bilan serverni yangilash
            PORT=5005 NITRO_PORT=5055 pm2 reload prohair-new || PORT=5005 NITRO_PORT=5055 pm2 start server.cjs --name "prohair-new"
            pm2 save
            
            echo "✅ Deploy muvaffaqiyatli yakunlandi!"
